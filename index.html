    <title>Ocean City Development Group | Luxury Coastal Homes</title>
    <meta name="description" content="Premier custom luxury home builder in Ocean City, NJ. Designed by Halliday Architects. View active listings and portfolio.">
    <meta name="author" content="Ocean City Development Group" />
    <meta name="robots" content="index, follow" id="robots-meta" />
    <script>
      // Preview / non-production hosts must not be indexable. The production
      // domain keeps index,follow; anything else (lovable.app previews, custom
      // staging, localhost) is swapped to noindex,nofollow before crawlers
      // parse the head further.
      (function () {
        try {
          var host = window.location.hostname;
          var isProd = host === "www.oceancitydevelopment.com" || host === "oceancitydevelopment.com";
          if (!isProd) {
            var m = document.getElementById("robots-meta");
            if (m) m.setAttribute("content", "noindex, nofollow");
          }
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/png" href="/favicon-32.png">
